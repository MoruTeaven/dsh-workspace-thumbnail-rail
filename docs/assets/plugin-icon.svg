<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="DSH Workspace Thumbnail Rail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f5bff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <g fill="#ffffff" fill-opacity="0.95">
    <!-- vertical rail -->
    <rect x="26" y="30" width="20" height="68" rx="7"/>
    <!-- a workspace tile on the rail -->
    <rect x="34" y="38" width="16" height="16" rx="5" fill="#ffffff"/>
    <circle cx="42" cy="46" r="3.2" fill="url(#bg)"/>
    <!-- sidebar / conversation pane -->
    <rect x="56" y="30" width="46" height="68" rx="9" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="66" y="44" width="26" height="6" rx="3" fill="url(#bg)"/>
    <rect x="66" y="58" width="26" height="6" rx="3" fill="url(#bg)" fill-opacity="0.7"/>
    <rect x="66" y="72" width="18" height="6" rx="3" fill="url(#bg)" fill-opacity="0.5"/>
  </g>
</svg>
